        try {
          const saved = JSON.parse(localStorage.getItem(storageKey));

          downloads: 0,
          organizations: 0,
          templates: {},

                    target="_blank"
                    rel="noreferrer"
                    className="rounded-full border border-gray-300 px-6 py-3 text-center text-sm font-bold text-karm-charcoal transition hover:border-karm-red hover:text-karm-red"
                  >
                    {copy.karmWebsite}
                  </a>
                </div>
              </div>
            </section>

            <section id="faq" className="bg-gray-50 py-20">
              <div className="mx-auto max-w-7xl px-5 lg:px-8">
                <div className="mb-10 max-w-3xl">
                  <p className={`text-sm font-black ${sectionLabelClass} text-karm-red`}>{copy.faqLabel}</p>
                  <h2 className="mt-4 text-4xl font-black tracking-normal text-karm-charcoal">
                    {copy.faqTitle}
                  </h2>
                </div>
                <div className="grid gap-5 md:grid-cols-2">
                  {copy.faqs.map(([question, answer], index) => (
                    <article key={question} className="rounded-lg border border-gray-200 bg-white p-6 shadow-sm">
                      <div className={`mb-4 h-2 w-16 rounded-full ${["bg-karm-red", "bg-karm-green", "bg-karm-blue", "bg-karm-orange"][index]}`}></div>
                      <h3 className="text-xl font-black text-karm-charcoal">{question}</h3>
                      <p className="mt-3 leading-7 text-gray-600">{answer}</p>
                    </article>
                  ))}
                </div>
              </div>
            </section>

            <footer className="mx-auto flex max-w-7xl flex-col gap-5 px-5 py-10 text-sm text-gray-500 md:flex-row md:items-center md:justify-between lg:px-8">
              <div className="flex items-center gap-4">
                <img src={logoSrc} alt="Karm" className="h-14 w-auto" />
                <span>{copy.footerText}</span>
              </div>
              <p>{copy.footerNote}</p>
            </footer>

          </main>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
